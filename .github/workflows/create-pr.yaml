name: Create Developer PR

on:
  push:
    branches:
      - developer

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GitHub authentication
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api user --jq '.login'

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh pr create \
            --base main \
            --head developer \
            --title "Developer → Main" \
            --body "Automatically created Pull Request from developer branch."
